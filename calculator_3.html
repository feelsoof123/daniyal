`<body>
<div id="uniBar"><a id="uniHome" href="./freetools.html">&#8592; Free Tools</a><button id="uniTheme" onclick="toggleUniTheme()">&#9728;&#65039; Light</button></div>


<div class="container">
    
    <h2>Lambai Unit Converter Calculator</h2>
    
    <div class="input-group">
        <label for="value">Value Darj Karein:</label>
        <input type="number" id="value" placeholder="Yahan likhein..." oninput="convertUnits()">
    </div>

    <div class="input-group">
        <label for="unit">Select Unit:</label>
        <select id="unit" onchange="convertUnits()">
            <option value="mm">Millimeter (mm)</option>
            <option value="soot">Soot</option>
            <option value="cm">Centimeter (cm)</option>
            <option value="inch">Inch</option>
            <option value="foot">Foot / Feet</option>
            <option value="gaz">Gaz / Yard</option>
            <option value="meter">Meter</option>
            <option value="km">Kilometer</option>
        </select>
    </div>

    <div class="results-box" id="results">
        Natija dekhne ke liye upar value darj karein...
    </div>
</div>

<div class="owner-box">
    <p><strong>Owner:</strong> Shaiekh Fielsouf Ansari</p>
    <p>Contact: <span>03331255512</span> | <span>03111855512</span></p>
</div>

<script>
    // Disable right click, copy, cut, and paste
    document.addEventListener('contextmenu', e => e.preventDefault());
    document.addEventListener('copy', e => e.preventDefault());
    document.addEventListener('cut', e => e.preventDefault());
    document.addEventListener('paste', e => e.preventDefault());

    function convertUnits() {
        let val = parseFloat(document.getElementById('value').value);
        let unit = document.getElementById('unit').value;
        let resultsDiv = document.getElementById('results');

        if (isNaN(val)) {
            resultsDiv.innerHTML = "Baraye meharbani koi valid number darj karein.";
            return;
        }

        // Convert input to meters as base unit
        let meters = 0;
        switch(unit) {
            case 'mm': meters = val / 1000; break;
            case 'soot': meters = val * 0.003175; break; // 1 inch = 25.4mm, 1 soot = 3.175mm
            case 'cm': meters = val / 100; break;
            case 'inch': meters = val * 0.0254; break;
            case 'foot': meters = val * 0.3048; break;
            case 'gaz': meters = val * 0.9144; break;
            case 'meter': meters = val; break;
            case 'km': meters = val * 1000; break;
        }

        // Calculate all units from meters
        let mm = meters * 1000;
        let soot = meters / 0.003175;
        let cm = meters * 100;
        let inch = meters / 0.0254;
        let foot = meters / 0.3048;
        let gaz = meters / 0.9144;
        let m = meters;
        let km = meters / 1000;

        resultsDiv.innerHTML = `
            <strong>Tamam Unit Hisaab:</strong><br>
            • Millimeter (mm): <strong>${mm.toFixed(2)}</strong> mm<br>
            • Soot: <strong>${soot.toFixed(2)}</strong> Soot<br>
            • Centimeter (cm): <strong>${cm.toFixed(2)}</strong> cm<br>
            • Inch: <strong>${inch.toFixed(2)}</strong> Inches<br>
            • Foot: <strong>${foot.toFixed(2)}</strong> Feet<br>
            • Gaz: <strong>${gaz.toFixed(4)}</strong> Gaz<br>
            • Meter: <strong>${m.toFixed(4)}</strong> Meters<br>
            • Kilometer: <strong>${km.toFixed(6)}</strong> km
        `;
    }
</script>


<script id="uniBarScript">
function toggleUniTheme(){
  var l=document.body.classList.toggle('u-light');
  document.getElementById('uniTheme').innerHTML=l?'&#127769; Dark':'&#9728;&#65039; Light';
  localStorage.setItem('uniTheme',l?'light':'dark');
}
(function(){
  if(localStorage.getItem('uniTheme')==='light'){
    document.body.classList.add('u-light');
    var b=document.getElementById('uniTheme');
    if(b)b.innerHTML='&#127769; Dark';
  }
})();
</script>
