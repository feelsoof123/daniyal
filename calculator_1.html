<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>جفری تکسیر | Takseer-e-Jafar Calculator</title>
    <link rel="icon" href="./favicon.ico" sizes="any">
    <link rel="apple-touch-icon" href="images/apple-touch-icon.png">
    <link rel="manifest" href="manifest.json">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

    <style>
        /* --- کاپی پروٹیکشن CSS --- */
        body {
            -webkit-user-select: none;
            -ms-user-select: none;
            user-select: none;
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background-image:
                radial-gradient(circle at 20% 20%, rgba(217,181,109,.16), transparent 35%),
                radial-gradient(circle at 80% 80%, rgba(30,64,175,.20), transparent 40%),
                linear-gradient(135deg, #080d1b, #172238, #090d18);
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            margin: 0;
            padding: 0;
            width: 100%;
            overflow-x: hidden;
        }

        input, textarea {
            -webkit-user-select: text;
            -ms-user-select: text;
            user-select: text;
        }

        .nastaliq {
            font-family: 'Noto Nastaliq Urdu', serif;
        }

        @keyframes blink-animation {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.3; transform: scale(1.1); }
            100% { opacity: 1; transform: scale(1); }
        }

        .blink-icon {
            animation: blink-animation 1.5s infinite ease-in-out;
            display: inline-block;
        }

        .main-header {
            padding-right: 180px;
            background-image:
                radial-gradient(circle at 20% 20%, rgba(217,181,109,.16), transparent 35%),
                radial-gradient(circle at 80% 80%, rgba(30,64,175,.20), transparent 40%),
                linear-gradient(135deg, #080d1b, #172238, #090d18);
            background-size: cover;
            background-position: center;
            color: #fbbf24;
            padding: 3.5rem 1rem;
            border-bottom: 6px solid #d97706;
            box-shadow: 0 10px 25px rgba(0,0,0,0.6);
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .header-title {
            font-size: clamp(2.5rem, 8vw, 4.5rem);
            line-height: 1.2;
            text-shadow: 3px 3px 15px rgba(0,0,0,0.9);
            margin-bottom: 30px;
        }

        .name-badge {
            background: rgba(0, 0, 0, 0.85);
            color: #ffffff;
            font-family: 'Arial', sans-serif;
            padding: 12px 40px;
            border-radius: 50px;
            border: 2px solid #fbbf24;
            font-size: clamp(1.2rem, 3.5vw, 1.8rem);
            font-weight: 900;
            box-shadow: 0 0 20px rgba(251, 191, 36, 0.5);
            margin-top: 20px;
            display: inline-block;
        }

        .contact-info {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            margin-top: 2.5rem;
            color: #ffffff;
            flex-wrap: wrap;
        }

        .contact-item {
            display: flex;
            align-items: center;
            gap: 8px;
            direction: ltr;
            background: rgba(0,0,0,0.8);
            padding: 8px 20px;
            border-radius: 25px;
            border: 1px solid rgba(251, 191, 36, 0.5);
            font-size: 1rem;
            font-weight: bold;
        }

        .input-section {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            padding: 2.5rem 1rem;
            border-bottom: 2px solid rgba(251, 191, 36, 0.3);
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            width: 100%;
        }

        .full-width-container {
            width: 100%;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .result-box-style {
            background-image:
                radial-gradient(circle at 20% 20%, rgba(217,181,109,.16), transparent 35%),
                radial-gradient(circle at 80% 80%, rgba(30,64,175,.20), transparent 40%),
                linear-gradient(135deg, #080d1b, #172238, #090d18);
            background-size: cover;
            background-position: center;
            border-top: 2px solid rgba(251, 191, 36, 0.6);
            border-bottom: 2px solid rgba(251, 191, 36, 0.6);
            box-shadow: 0 15px 35px rgba(0,0,0,0.7);
            width: 100%;
        }

        .letter-tile {
            border: 1px solid #cbd5e1;
            width: clamp(34px, 4.8vw, 50px);
            height: clamp(34px, 4.8vw, 50px);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: clamp(1rem, 2.8vw, 1.5rem);
            font-weight: bold;
        }

        .row-even { color: #1e40af; background: rgba(255, 255, 255, 0.98); }
        .row-odd { color: #b91c1c; background: rgba(255, 245, 245, 0.98); }

        .special-box {
            border: 3px solid #000000 !important;
            background: #fbbf24 !important;
            z-index: 10;
            color: #000 !important;
            transform: scale(1.02);
        }

        .zamaam-row {
            background: #94a3b8 !important;
            font-weight: 900;
            color: #000;
        }

        .label-tile {
            background: #f1f5f9;
            color: #64748b;
            font-size: 0.75rem;
            font-weight: bold;
        }

        .footer-copyright {
            margin-top: auto;
            padding: 1.5rem 0;
            background-image:
                radial-gradient(circle at 20% 20%, rgba(217,181,109,.16), transparent 35%),
                radial-gradient(circle at 80% 80%, rgba(30,64,175,.20), transparent 40%),
                linear-gradient(135deg, #080d1b, #172238, #090d18);
            background-size: cover;
            border-top: 4px solid #d97706;
            width: 100%;
            position: relative;
            text-align: center;
        }

        .footer-overlay {
            background: rgba(0, 0, 0, 0.85);
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 1;
        }

        .copyright-content {
            position: relative;
            z-index: 2;
            color: #ffffff;
            font-size: 1.1rem;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .golden-text { color: #fbbf24; font-weight: bold; }

        .custom-scroll::-webkit-scrollbar { height: 10px; }
        .custom-scroll::-webkit-scrollbar-thumb {
            background: #d97706;
            border-radius: 10px;
        }

        .info-grid {
            display: grid;
            grid-template-columns: 1fr;
            width: 100%;
        }

        @media (min-width: 1024px) {
            .info-grid { grid-template-columns: 1fr 1fr; }
        }

        /* --- صرف تکسیر نتیجے کا A4 پرنٹ --- */
        .print-result-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin: 20px auto;
            background: #15803d;
            color: #fff;
            border: 0;
            border-radius: 12px;
            padding: 14px 28px;
            font-size: 1.05rem;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 6px 15px rgba(0,0,0,.25);
            transition: transform 0.2s, background-color 0.2s;
        }
        .print-result-btn:hover {
            background: #166534;
            transform: translateY(-2px);
        }

        @media print {
            @page {
                size: A4 portrait;
                margin: 10mm;
            }

            body {
                background: #fff !important;
                min-height: auto !important;
                display: block !important;
                width: 100% !important;
                margin: 0 !important;
                padding: 0 !important;
                overflow: visible !important;
            }

            #uniBar,
            body > header,
            body > footer,
            .input-section,
            #printResultWrap {
                display: none !important;
            }

            body > main {
                display: block !important;
                width: 100% !important;
                min-height: 0 !important;
                margin: 0 !important;
                padding: 0 !important;
            }

            #resultView {
                display: block !important;
                visibility: visible !important;
                width: 100% !important;
                margin: 0 !important;
                padding: 0 !important;
            }

            #resultView .custom-scroll {
                display: block !important;
                overflow: visible !important;
                width: 100% !important;
                padding: 4mm !important;
                margin: 0 !important;
                background: #fff !important;
                box-shadow: none !important;
                border: 0 !important;
            }

            #gridArea {
                display: inline-flex !important;
                visibility: visible !important;
                transform: none !important;
                max-width: 100% !important;
                box-shadow: none !important;
                border: 2px solid #000 !important;
            }

            #gridArea .letter-tile {
                color: #000 !important;
                background: #fff !important;
                border-color: #000 !important;
            }

            #gridArea .special-box {
                background: #fbbf24 !important;
                color: #000 !important;
                border: 3px solid #000 !important;
            }

            #gridArea .zamaam-row {
                background: #d1d5db !important;
                color: #000 !important;
            }

            #resultView .info-grid {
                display: grid !important;
                margin-top: 15px !important;
            }

            #resultView .result-box-style {
                background-image: none !important;
                background: #fff !important;
                color: #000 !important;
                box-shadow: none !important;
                border: 1px solid #000 !important;
                padding: 6mm !important;
                break-inside: avoid !important;
            }

            #resultView .result-box-style h3,
            #resultView .result-box-style p,
            #resultView .result-box-style span {
                color: #000 !important;
                text-shadow: none !important;
            }

            #resultView .result-box-style .golden-text,
            #resultView .result-box-style .text-amber-300,
            #resultView .result-box-style .text-amber-200 {
                color: #000 !important;
            }
        }

        @media (max-width: 768px) {
            .main-header {
                padding-right: 1rem !important;
                padding-top: 4.5rem !important;
            }
        }
    </style>

<body>

    <header class="main-header">

    <script>
        /* --- کاپی پروٹیکشن JavaScript --- */
        document.addEventListener('contextmenu', function(e) {
            if (e.target.tagName !== 'INPUT' && e.target.tagName !== 'TEXTAREA') {
                e.preventDefault();
            }
        });

        document.addEventListener('keydown', function(e) {
            if (e.target.matches('input, textarea')) {
                return;
            }
            if (
                e.ctrlKey &&
                (
                    e.key.toLowerCase() === 'c' ||
                    e.key.toLowerCase() === 'v' ||
                    e.key.toLowerCase() === 'u' ||
                    e.key.toLowerCase() === 's' ||
                    e.key.toLowerCase() === 'i'
                )
            ) {
                e.preventDefault();
            }
        });

        const userInput = document.getElementById('userInput');
        if (userInput) {
            userInput.addEventListener('paste', function(e) {
                const pastedText = (e.clipboardData || window.clipboardData).getData('text');
                if (pastedText) {
                    e.preventDefault();
                    const start = this.selectionStart;
                    const end = this.selectionEnd;
                    const cleanPaste = pastedText.replace(/[\r\n]+/g, ' ');
                    this.value = this.value.slice(0, start) + cleanPaste + this.value.slice(end);
                    const newPos = start + cleanPaste.length;
                    this.setSelectionRange(newPos, newPos);
                    this.dispatchEvent(new Event('input', { bubbles: true }));
                }
            });

            userInput.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    calculate('sadar');
                }
            });
        }

        const abjad = {
            'ا':1,'ب':2,'ج':3,'د':4,'ہ':5,'و':6,'ز':7,'ح':8,'ط':9,'ی':10,
            'ک':20,'ل':30,'م':40,'ن':50,'س':60,'ع':70,'ف':80,'ص':90,'ق':100,
            'ر':200,'ش':300,'ت':400,'ث':500,'خ':600,'ذ':700,'ض':800,'ظ':900,
            'غ':1000,'ة':400,'ؤ':6,'ئ':10,'أ':1,'آ':1
        };

        function printTakseerA4() {
            window.print();
        }

        function clearAll() {
            const input = document.getElementById('userInput');
            if (input) input.value = "";
            const res = document.getElementById('resultView');
            if (res) res.classList.add('hidden');
            const pWrap = document.getElementById('printResultWrap');
            if (pWrap) pWrap.classList.add('hidden');
            const grid = document.getElementById('gridArea');
            if (grid) grid.innerHTML = "";
        }

        function calculate(mode) {
            const inputEl = document.getElementById('userInput');
            if (!inputEl) return;
            let rawVal = inputEl.value;
            if (!rawVal) return;

            let cleanText = rawVal.replace(/[\u064B-\u065F\u0670\u0610-\u061A]/g, "");
            let expandedVal = cleanText.replace(/ة/g, 'تہ');

            let valArr = expandedVal.split('').filter(char => char.trim() !== '');
            if (valArr.length === 0) return;

            const res = document.getElementById('resultView');
            if (res) res.classList.remove('hidden');

            const pWrap = document.getElementById('printResultWrap');
            if (pWrap) pWrap.classList.remove('hidden');

            let originalStr = valArr.join('');
            let rows = [[...valArr]];
            let current = [...valArr];

            for (let i = 0; i < 500; i++) {
                let next = [];
                let temp = [...current];

                if (mode === 'mokhar') {
                    while (temp.length > 0) {
                        next.push(temp.pop());
                        if (temp.length > 0) next.push(temp.shift());
                    }
                } else {
                    while (temp.length > 0) {
                        next.push(temp.shift());
                        if (temp.length > 0) next.push(temp.pop());
                    }
                }

                rows.push([...next]);
                current = [...next];

                if (current.join('') === originalStr) break;
            }

            render(rows, originalStr);
        }

        function render(rows, original) {
            const grid = document.getElementById('gridArea');
            grid.innerHTML = "";

            let totalCols = rows[0].length;
            let totalRowsCount = rows.length;

            let tRow = document.createElement('div');
            tRow.className = "flex";

            tRow.appendChild(createBox("#", "letter-tile label-tile"));

            for (let i = 1; i <= totalCols; i++) {
                tRow.appendChild(createBox(i, "letter-tile label-tile"));
            }

            grid.appendChild(tRow);

            let midRows =
                (totalRowsCount % 2 !== 0)
                ? [Math.floor(totalRowsCount / 2)]
                : [(totalRowsCount / 2) - 1, totalRowsCount / 2];

            let midCols =
                (totalCols % 2 !== 0)
                ? [Math.floor(totalCols / 2)]
                : [Math.floor((totalCols - 1) / 2), Math.ceil((totalCols - 1) / 2)];

            rows.forEach((row, rIdx) => {
                let isZamaam = (rIdx > 0 && row.join('') === original);

                let rowDiv = document.createElement('div');
                rowDiv.className = `flex ${rIdx % 2 === 0 ? 'row-even' : 'row-odd'} ${isZamaam ? 'zamaam-row' : ''}`;

                rowDiv.appendChild(
                    createBox(
                        isZamaam ? "زمام" : rIdx + 1,
                        "letter-tile label-tile"
                    )
                );

                row.forEach((char, cIdx) => {
                    let tile = document.createElement('div');
                    tile.className = "letter-tile";

                    let isHeart = (midRows.includes(rIdx) && midCols.includes(cIdx));
                    let isCorner = (
                        (rIdx === 0 || rIdx === totalRowsCount - 1) &&
                        (cIdx === 0 || cIdx === totalCols - 1)
                    );

                    if (isHeart || isCorner) {
                        tile.classList.add("special-box");
                    }

                    tile.innerText = char;
                    rowDiv.appendChild(tile);
                });

                grid.appendChild(rowDiv);
            });

            finalize(rows, midRows, midCols);
        }

        function createBox(t, c) {
            let d = document.createElement('div');
            d.className = c;
            d.innerText = t;
            return d;
        }

        function finalize(rows, midRows, midCols) {
            let heartLetters = [];
            midRows.forEach(r => {
                midCols.forEach(c => {
                    if (rows[r] && rows[r][c]) heartLetters.push(rows[r][c]);
                });
            });

            document.getElementById('heartCharsText').innerText = heartLetters.join(' - ');
            document.getElementById('tilismiRow').innerText = heartLetters.join('');

            let firstRow = rows[0];
            let lastRow = rows[rows.length - 1];
            let corners = [firstRow[0], firstRow[firstRow.length - 1], lastRow[0], lastRow[lastRow.length - 1]];
            document.getElementById('cornerChars').innerText = corners.join(' ، ');

            let total = heartLetters.concat(corners).reduce((a, b) => a + (abjad[b] || 0), 0);
            document.getElementById('finalSum').innerText = total;

            let n = "", temp = total;
            const keys = Object.keys(abjad).sort((a, b) => abjad[b] - abjad[a]);
            for (let k of keys) {
                if (['ة', 'ؤ', 'ئ', 'أ', 'آ'].includes(k)) continue;
                while (temp >= abjad[k]) {
                    n += k;
                    temp -= abjad[k];
                }
            }
            document.getElementById('mokalRes').innerText = n + "ائیل";
        }
    </script>

    <script id="uniBarScript">
    function toggleUniTheme(){
      var l=document.body.classList.toggle('u-light');
      document.getElementById('uniTheme').innerHTML=l?'&#127769; Dark':'&#9728;&#65039; Light';
      localStorage.setItem('uniTheme',l?'light':'dark');
    }
    (function(){
      if(localStorage.getItem('uniTheme')==='light'){
        document.body.classList.add('u-light');
        var b=document.getElementById('uniTheme');
        if(b)b.innerHTML='&#127769; Dark';
      }
    })();
    </script>
