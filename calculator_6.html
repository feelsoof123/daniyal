:color-mix(in srgb,var(--good),var(--line) 55%);color:var(--good)}.key.wide{--w:1.5}.key.xwide{--w:2}.key.xxwide{--w:2.5}.key.space{--w:6}.key.spacer{visibility:hidden;border:0;background:transparent;box-shadow:none}.key.empty{visibility:hidden;border:0;background:transparent;box-shadow:none}

.lower{display:grid;grid-template-columns:1.4fr 1fr;gap:14px;margin-top:16px}.log{height:155px;overflow:auto;padding:13px;display:flex;align-content:flex-start;gap:7px;flex-wrap:wrap}.log-item{background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:5px 8px;font:12px ui-monospace,monospace;color:var(--accent)}.empty-state{color:var(--muted);font-size:13px}.status-body{padding:17px 20px}.status-line{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px}.status-line:last-child{border:0}.status-line span:first-child{color:var(--muted)}.status-good{color:var(--good);font-weight:700}.status-warn{color:var(--bad);font-weight:700}

</style>

/* ===== UNIFIED NAV BAR ===== */

};
const labels={Escape:'Esc',Backspace:'Backspace',CapsLock:'Caps',ControlLeft:'Ctrl',ControlRight:'Ctrl',MetaLeft:'Win',MetaRight:'Win',AltLeft:'Alt',AltRight:'Alt',ContextMenu:'Menu',Space:'Space',ArrowUp:'↑',ArrowDown:'↓',ArrowLeft:'←',ArrowRight:'→',PrintScreen:'PrtSc',ScrollLock:'ScrLk',Pause:'Pause',Insert:'Ins',Delete:'Del',PageUp:'PgUp',PageDown:'PgDn',Home:'Home',End:'End',NumLock:'Num',NumpadDivide:'/',NumpadMultiply:'*',NumpadSubtract:'−',NumpadAdd:'+',NumpadEnter:'Enter',NumpadDecimal:'.',ShiftLeft:'Shift',ShiftRight:'Shift',BracketLeft:'[',BracketRight:']',Backslash:'\\',Backquote:'`',Minus:'-',Equal:'=',Semicolon:';',Quote:"'",Comma:',',Period:'.',Slash:'/'};

<script id="uniBarScript">

  var l=document.body.classList.toggle('u-light');
  document.getElementById('uniTheme').innerHTML=l?'&#127769; Dark':'&#9728;&#65039; Light';
  localStorage.setItem('uniTheme',l?'light':'dark');

    document.body.classList.add('u-light');
    var b=document.getElementById('uniTheme');
    if(b)b.innerHTML='&#127769; Dark';
  }
})();
